<!doctype html>
<html lang="en">
<body style="font-family: Arial, sans-serif; color: #111827; line-height: 1.6;">
  <h1 style="font-size: 22px;">Reset your password</h1>
  <p>Hello {{ user.get_username }},</p>
  <p>We received a request to reset the password for your Municipality Project Tracker account.</p>
  <p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Choose a new password</a></p>
  <p>This secure link expires after 24 hours. If you did not request a reset, ignore this email and your password will remain unchanged.</p>
</body>
</html>
