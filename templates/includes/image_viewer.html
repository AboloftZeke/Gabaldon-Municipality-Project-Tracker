<div class="image-viewer" data-image-viewer hidden role="dialog" aria-modal="true" aria-label="Image preview">
    <button type="button" class="image-viewer__backdrop" data-image-viewer-close tabindex="-1" aria-label="Close image preview"></button>
    <figure class="image-viewer__content">
        <button type="button" class="image-viewer__close" data-image-viewer-close aria-label="Close image preview">&times;</button>
        <img data-image-viewer-image alt="">
        <figcaption data-image-viewer-caption></figcaption>
    </figure>
</div>
